[project]
name = "routeforge-train"
version = "0.1.0"
description = "Offline trainer, calibrator and evaluator for RouteForge routing policies"
requires-python = ">=3.14"
license = "Apache-2.0"
# Exact dependency pins live in requirements.txt and requirements-dev.txt.

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
