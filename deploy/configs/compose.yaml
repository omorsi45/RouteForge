# Config of the compose stack in deploy/docker-compose.yml. Local demo only.
# Clients send the bearer value rf_local_demo_only. Generate real keys with: routeforge keygen
#
# Like policy-fake.yaml: the trained routing policy over six simulated
# providers, one per pool model, with synthetic latency from the settings below.
# Usage records, routing decisions and policies live in PostgreSQL, and rate
# limits and budgets in Redis. The connection strings are read from the
# environment variables named below and never appear in this file; the compose
# file sets them for the local stack.
# Relative paths resolve against the directory of this file, which is
# deploy/configs in the repository and /etc/routeforge/deploy/configs in the
# image, where the policy and the price file sit in the same relative layout.
server:
  listen: ":8080"

storage:
  type: postgres
  dsn_env: ROUTEFORGE_POSTGRES_DSN

limiter:
  type: redis
  url_env: ROUTEFORGE_REDIS_URL

tenants:
  - name: demo
    api_key_sha256:
      - 886ec24d8618d51171c94b1352ac7b95b4e82b97a5d2bff15045161351caa052
    allow_strategy_override: true

policy:
  path: ../../trainer/artifacts/policy.json

pricing:
  file: ../prices.yaml

providers:
  - name: fake-1
    type: fake
    fake:
      seed: 1
      ttft: 600ms
      per_token: 16.667ms
      jitter: 0.1
      output_tokens: 64
  - name: fake-2
    type: fake
    fake:
      seed: 2
      ttft: 700ms
      per_token: 22.222ms
      jitter: 0.1
      output_tokens: 64
  - name: fake-3
    type: fake
    fake:
      seed: 3
      ttft: 500ms
      per_token: 13.333ms
      jitter: 0.1
      output_tokens: 64
  - name: fake-4
    type: fake
    fake:
      seed: 4
      ttft: 400ms
      per_token: 11.111ms
      jitter: 0.1
      output_tokens: 64
  - name: fake-5
    type: fake
    fake:
      seed: 5
      ttft: 300ms
      per_token: 9.524ms
      jitter: 0.1
      output_tokens: 64
  - name: fake-6
    type: fake
    fake:
      seed: 6
      ttft: 200ms
      per_token: 8.333ms
      jitter: 0.1
      output_tokens: 64

models:
  - name: gpt-5
    provider: fake-1
    latency_prior: {ttft_ms: 600, decode_tokens_per_s: 60, jitter: 0.1}
  - name: claude-sonnet-4
    provider: fake-2
    latency_prior: {ttft_ms: 700, decode_tokens_per_s: 45, jitter: 0.1}
  - name: gemini-2.5-pro
    provider: fake-3
    strongest: true
    latency_prior: {ttft_ms: 500, decode_tokens_per_s: 75, jitter: 0.1}
  - name: gemini-2.5-flash
    provider: fake-4
    latency_prior: {ttft_ms: 400, decode_tokens_per_s: 90, jitter: 0.1}
  - name: deepseek-v3.1-terminus
    provider: fake-5
    latency_prior: {ttft_ms: 300, decode_tokens_per_s: 105, jitter: 0.1}
  - name: qwen3-235b-a22b-2507
    provider: fake-6
    latency_prior: {ttft_ms: 200, decode_tokens_per_s: 120, jitter: 0.1}
