# Local demo only. Clients send the bearer value rf_local_demo_only. Generate real keys with: routeforge keygen
#
# Serves the trained routing policy over six simulated providers, one per pool
# model. Latency numbers come from bench/latency_profiles.yaml and are
# synthetic, not measurements of any provider. Prices come from the price file.
# Relative paths resolve against the directory of this file.
tenants:
  - name: demo
    api_key_sha256:
      - 886ec24d8618d51171c94b1352ac7b95b4e82b97a5d2bff15045161351caa052
    allow_strategy_override: true

policy:
  path: ../../trainer/artifacts/policy.json

pricing:
  file: ../prices.yaml

providers:
  - name: fake-1
    type: fake
    fake:
      seed: 1
      ttft: 600ms
      per_token: 16.667ms
      jitter: 0.1
      output_tokens: 64
  - name: fake-2
    type: fake
    fake:
      seed: 2
      ttft: 700ms
      per_token: 22.222ms
      jitter: 0.1
      output_tokens: 64
  - name: fake-3
    type: fake
    fake:
      seed: 3
      ttft: 500ms
      per_token: 13.333ms
      jitter: 0.1
      output_tokens: 64
  - name: fake-4
    type: fake
    fake:
      seed: 4
      ttft: 400ms
      per_token: 11.111ms
      jitter: 0.1
      output_tokens: 64
  - name: fake-5
    type: fake
    fake:
      seed: 5
      ttft: 300ms
      per_token: 9.524ms
      jitter: 0.1
      output_tokens: 64
  - name: fake-6
    type: fake
    fake:
      seed: 6
      ttft: 200ms
      per_token: 8.333ms
      jitter: 0.1
      output_tokens: 64

models:
  - name: gpt-5
    provider: fake-1
    latency_prior: {ttft_ms: 600, decode_tokens_per_s: 60, jitter: 0.1}
  - name: claude-sonnet-4
    provider: fake-2
    latency_prior: {ttft_ms: 700, decode_tokens_per_s: 45, jitter: 0.1}
  - name: gemini-2.5-pro
    provider: fake-3
    strongest: true
    latency_prior: {ttft_ms: 500, decode_tokens_per_s: 75, jitter: 0.1}
  - name: gemini-2.5-flash
    provider: fake-4
    latency_prior: {ttft_ms: 400, decode_tokens_per_s: 90, jitter: 0.1}
  - name: deepseek-v3.1-terminus
    provider: fake-5
    latency_prior: {ttft_ms: 300, decode_tokens_per_s: 105, jitter: 0.1}
  - name: qwen3-235b-a22b-2507
    provider: fake-6
    latency_prior: {ttft_ms: 200, decode_tokens_per_s: 120, jitter: 0.1}
