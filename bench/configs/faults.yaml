# Fault benchmark gateway. Six simulated providers, one per pool model, fail in
# the ways a real upstream does, and the benchmark checks that the gateway's
# accounting stays exact through all of it (scripts/bench.sh faults). The
# numbers are synthetic, not measurements of any provider. Relative paths
# resolve against the directory of this file.
#
# Faults, by provider (every one also cuts 10% of its streams short after the
# first word and leaves usage out of 20% of its answers):
#   fake-1 gpt-5                    answers 30% of calls with rate_limited, retry after 50 ms
#   fake-3 gemini-2.5-pro           first byte after 5 s, longer than the 2000 ms
#                                   deadline every request carries: timeouts
#   fake-5 deepseek-v3.1-terminus   fails 20% of calls with unavailable
#   fake-6 qwen3-235b-a22b-2507     fails 20% of calls with unavailable
#   fake-4 gemini-2.5-flash         reports 50 completion tokens more than it sends
#                                   (over_report_tokens), and only the bench-over
#                                   tenant is pinned to it
# The others have no fault of their own.
#
# The latency priors are the ranks of bench/latency_profiles.yaml for time to
# first token, but not for decode speed. The router drops a model whose
# predicted p95 does not fit in the time left, and it predicts from the policy's
# expected output tokens (up to 2150 for gemini-2.5-pro). At the profile speeds
# (45 to 120 tokens per second) every model needs seconds, and none fits in the
# 2000 ms deadline, so every request would be refused with no_eligible_model.
# The decode speed here is the speed of these fast simulated providers, and the
# prior is as optimistic about the model that times out as about the others: it
# stays eligible until its circuit breaker opens, which is the behavior under
# test.
server:
  max_inflight: 1024

admin:
  # test-admin-key is a public benchmark key for loopback runs only. Never
  # expose a gateway that accepts it.
  api_key_sha256:
    - 944650a7cd0f9e14d5c4fb15edbffb7fa45fb9ed36a4fa9be3d7e5476ae51bd9

tenants:
  # The budget of bench never binds: the run costs far less. The benchmark
  # still checks that the tenant spent no more than it.
  - name: bench
    # test-key-bench is a public benchmark key for loopback runs only. Never
    # expose a gateway that accepts it.
    api_key_sha256:
      - 7c0c7e4891f7e2af5ed802eda1f4c03bbeaeddaf2cc920c8b74275b1e30268aa
    allow_strategy_override: true
    max_output_tokens: 256
    daily_budget_usd: 100
  # bench-over may use only the model that reports more tokens than it can have
  # reserved for. Its requests ask for 16 output tokens at most, so each is
  # reserved at about 43,000 nano-USD (a short prompt at 300 nano-USD per
  # token, 16 tokens at 2,500) and the over-reporting provider bills about
  # 166,000 for it. The budget, 3,000,000 nano-USD, holds the reservations of
  # the first 32 requests (concurrency 32), which are admitted together and
  # settle at about 4.4 million: spend goes past the budget and the overshoot is
  # the excess.
  - name: bench-over
    # test-key-bench-over is a public benchmark key for loopback runs only.
    api_key_sha256:
      - 1266f059dc22d40e742af74f360ac382ef767a86b4f7a91ee120531903b52cd4
    allowed_models: [gemini-2.5-flash]
    daily_budget_usd: 0.003

policy:
  path: ../../trainer/artifacts/policy.json

pricing:
  file: ../../deploy/prices.yaml

providers:
  - name: fake-1
    type: fake
    fake:
      seed: 1
      ttft: 20ms
      per_token: 250us
      jitter: 0.1
      output_tokens: 64
      error_rate: 0.3
      error_kind: rate_limited
      retry_after: 50ms
      disconnect_rate: 0.1
      omit_usage_rate: 0.2
  - name: fake-2
    type: fake
    fake:
      seed: 2
      ttft: 20ms
      per_token: 250us
      jitter: 0.1
      output_tokens: 64
      disconnect_rate: 0.1
      omit_usage_rate: 0.2
  - name: fake-3
    type: fake
    fake:
      seed: 3
      ttft: 5s
      per_token: 250us
      jitter: 0.1
      output_tokens: 64
      disconnect_rate: 0.1
      omit_usage_rate: 0.2
  - name: fake-4
    type: fake
    fake:
      seed: 4
      ttft: 250ms
      per_token: 250us
      jitter: 0.1
      output_tokens: 64
      over_report_tokens: 50
      disconnect_rate: 0.1
      omit_usage_rate: 0.2
  - name: fake-5
    type: fake
    fake:
      seed: 5
      ttft: 20ms
      per_token: 250us
      jitter: 0.1
      output_tokens: 64
      error_rate: 0.2
      error_kind: unavailable
      disconnect_rate: 0.1
      omit_usage_rate: 0.2
  - name: fake-6
    type: fake
    fake:
      seed: 6
      ttft: 20ms
      per_token: 250us
      jitter: 0.1
      output_tokens: 64
      error_rate: 0.2
      error_kind: unavailable
      disconnect_rate: 0.1
      omit_usage_rate: 0.2

models:
  - name: gpt-5
    provider: fake-1
    latency_prior: {ttft_ms: 600, decode_tokens_per_s: 4000, jitter: 0.1}
  - name: claude-sonnet-4
    provider: fake-2
    latency_prior: {ttft_ms: 700, decode_tokens_per_s: 4000, jitter: 0.1}
  - name: gemini-2.5-pro
    provider: fake-3
    strongest: true
    latency_prior: {ttft_ms: 500, decode_tokens_per_s: 4000, jitter: 0.1}
  - name: gemini-2.5-flash
    provider: fake-4
    latency_prior: {ttft_ms: 400, decode_tokens_per_s: 4000, jitter: 0.1}
  - name: deepseek-v3.1-terminus
    provider: fake-5
    latency_prior: {ttft_ms: 300, decode_tokens_per_s: 4000, jitter: 0.1}
  - name: qwen3-235b-a22b-2507
    provider: fake-6
    latency_prior: {ttft_ms: 200, decode_tokens_per_s: 4000, jitter: 0.1}
